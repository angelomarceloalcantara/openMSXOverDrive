# =============================================================================
# Compila qualquer fork do openMSX para Windows x64 (cross-compile MinGW-w64
# em Linux, o mesmo método que a equipe do openMSX usa no GitHub Actions).
#
# Uso: Actions > "openMSX Windows (fork)" > Run workflow, e informe:
#   repo : repositório do fork          (padrão: alexmoncks/openMSX)
#   ref  : branch, tag ou commit        (padrão: msx2pp)
#
# Outros forks úteis:  maxiwamoto/openMSX @ rom-dev-2026.10.28  (V9968 + Makoto)
#                      buppu3/openMSX                           (origem do V9968)
#
# Salve como .github/workflows/build-openmsx-windows-fork.yml
# =============================================================================
name: openMSX Windows (fork)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repositório do fork (dono/nome)"
        required: true
        default: "alexmoncks/openMSX"
      ref:
        description: "Branch, tag ou commit"
        required: true
        default: "msx2pp"
      flavour:
        description: "Flavour do build (opt = otimizado)"
        required: true
        default: "opt"

env:
  TARGET_CPU: x86_64
  TARGET_OS: mingw-w64
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Baixar o código do fork
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0          # o build usa o histórico git para a versão
          fetch-tags: true

      - name: Instalar toolchain e dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            python3 make cmake pkg-config nasm autoconf automake libtool \
            wget curl xz-utils unzip p7zip-full ccache zip
          # Usa o runtime "posix" (necessário para std::thread/std::mutex)
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          x86_64-w64-mingw32-g++ --version

      - name: Mostrar o que o fork oferece (diagnóstico)
        run: |
          git log -1 --format='commit %H%n%s'
          ls -1 | head -50
          ls build | head -50
          ls doc/manual 2>/dev/null | head -20 || true

      # ---- ccache: acelera recompilações dos fontes do openMSX ----
      - name: Ativar ccache para o MinGW
        run: |
          sudo mkdir -p /usr/lib/ccache
          for t in gcc g++ cc c++; do
            sudo ln -sf /usr/bin/ccache /usr/lib/ccache/x86_64-w64-mingw32-$t
          done
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Cache do ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-win-${{ inputs.repo }}-${{ inputs.flavour }}-${{ github.run_id }}
          restore-keys: |
            ccache-win-${{ inputs.repo }}-${{ inputs.flavour }}-

      # ---- cache das bibliotecas de terceiros (SDL, Tcl, FreeType, etc.) ----
      - name: Cache das bibliotecas de terceiros
        id: cache-3rd
        uses: actions/cache@v4
        with:
          path: |
            derived/3rdparty
            derived/${{ env.TARGET_CPU }}-${{ env.TARGET_OS }}-${{ inputs.flavour }}-3rd/3rdparty
          key: 3rd-win-${{ inputs.flavour }}-${{ hashFiles('build/3rdparty.mk', 'build/3rdparty/**', 'build/libraries.py') }}

      - name: Compilar bibliotecas de terceiros
        if: steps.cache-3rd.outputs.cache-hit != 'true'
        run: |
          make -f build/main.mk run-3rdparty \
            OPENMSX_TARGET_CPU=$TARGET_CPU \
            OPENMSX_TARGET_OS=$TARGET_OS \
            OPENMSX_FLAVOUR=${{ inputs.flavour }} \
            3RDPARTY_FLAG=true \
            PYTHON=python3

      - name: Compilar o openMSX e gerar o pacote binário
        run: |
          make -j"$(nproc)" -f build/main.mk bindist \
            OPENMSX_TARGET_CPU=$TARGET_CPU \
            OPENMSX_TARGET_OS=$TARGET_OS \
            OPENMSX_FLAVOUR=${{ inputs.flavour }} \
            3RDPARTY_FLAG=true \
            PYTHON=python3
          ccache -s

      - name: Localizar e compactar o resultado
        id: pack
        run: |
          OUT=derived/${TARGET_CPU}-${TARGET_OS}-${{ inputs.flavour }}-3rd
          echo "Conteúdo de $OUT:"; ls -la "$OUT" || true
          EXE=$(find derived -name 'openmsx.exe' | head -n1)
          echo "Executável: $EXE"
          test -n "$EXE"
          BIN=$(find "$OUT" -maxdepth 2 -type d -name 'bindist' | head -n1)
          mkdir -p dist
          NAME="openmsx-$(echo '${{ inputs.repo }}' | tr '/' '-')-${{ inputs.ref }}-windows-x64"
          if [ -n "$BIN" ] && [ -d "$BIN" ]; then
            (cd "$BIN" && zip -r -9 "$GITHUB_WORKSPACE/dist/$NAME.zip" .)
          else
            zip -9 "dist/$NAME.zip" "$EXE"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: dist/*.zip
          if-no-files-found: error
